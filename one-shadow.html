<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>One Shadow</title>
<style>
  @font-face { font-family: 'EB Garamond'; src: url('assets/fonts/eb-garamond-latin-400-normal.woff2') format('woff2'); font-weight: 400; font-style: normal; }
  @font-face { font-family: 'EB Garamond'; src: url('assets/fonts/eb-garamond-latin-400-italic.woff2') format('woff2'); font-weight: 400; font-style: italic; }
  html, body { height: 100%; margin: 0; }
  body { background: #11130f; color: #d9cfb8; display: flex; align-items: center; justify-content: center; text-align: center;
         font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; padding: 24px; box-sizing: border-box; }
  main { max-width: 34rem; animation: f 4s ease both; }
  h1 { font-weight: 400; font-size: .95rem; letter-spacing: .5em; margin: 0 0 3.2rem; color: #a59c88; padding-left: .5em; }
  p { font-size: clamp(1.15rem, 3.2vw, 1.5rem); line-height: 1.7; margin: 0 0 1.4rem; font-style: italic; }
  @keyframes f { from { opacity: 0; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { main { animation: none; } }
</style>
</head>
<body>
<main>
  <h1>ONE SHADOW</h1>
  <p>In every forest there are thousands of stalks.</p>
  <p>Yet sometimes the wind chooses only one.</p>
</main>
</body>
</html>
